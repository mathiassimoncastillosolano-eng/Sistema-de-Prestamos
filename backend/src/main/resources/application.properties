spring.config.import=optional:file:.env[.properties]
spring.application.name=backend

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# Las sentencias SQL no incluyen valores enlazados, pero en produccion se mantiene apagado (JPA_SHOW_SQL=true para depurar).
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Sesion (cookie HttpOnly emitida por el servidor; el navegador nunca ve un token) ---
server.servlet.session.cookie.name=NEXORA_SESION
server.servlet.session.cookie.http-only=true
# true por defecto. En desarrollo local sobre http usa SESSION_COOKIE_SECURE=false.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

# --- Proteccion contra fuerza bruta en el inicio de sesion (por correo) ---
nexora.seguridad.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
nexora.seguridad.login.ventana-minutos=${LOGIN_VENTANA_MINUTOS:15}
nexora.seguridad.login.bloqueo-minutos=${LOGIN_BLOQUEO_MINUTOS:15}

# --- API PERÚ para las consultas de DNI y RUC ---
apiperu.base-url=https://api.apiperu.dev
apiperu.token=${APIPERU_TOKEN}

# --- Contrato de préstamo: datos del prestamista (los que no se configuren se declaran "no definidos" en el contrato) ---
nexora.contrato.prestamista.denominacion=${CONTRATO_PRESTAMISTA_DENOMINACION:Pr\u00e9stamos Castillo}
nexora.contrato.prestamista.ruc=${CONTRATO_PRESTAMISTA_RUC:}
nexora.contrato.prestamista.domicilio=${CONTRATO_PRESTAMISTA_DOMICILIO:}
nexora.contrato.prestamista.representante=${CONTRATO_PRESTAMISTA_REPRESENTANTE:}
# Hermes es SIMULADO de forma permanente (decisión del proyecto: no se conectará a un Hermes real).
# Poner HERMES_SIMULADO=false deja las aprobaciones rechazadas (HERMES_NO_CONFIGURADO).
nexora.caja.hermes.simulado=${HERMES_SIMULADO:true}
# Secreto de la huella del código. Cambiar en producción con HERMES_HUELLA_SECRETO; el valor por defecto es solo de demostración.
nexora.caja.hermes.huella-secreto=${HERMES_HUELLA_SECRETO:castillo-demo-huella-hermes-simulado-cambiar}
