<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NEXORA FINANCE · Gestión de préstamos</title>
    <meta name="description" content="Gestión de préstamos (módulos de negocio con datos ficticios)." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Aplica el tema guardado (o el del sistema) ANTES de pintar: evita el destello del tema equivocado. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('nx-tema'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
        document.documentElement.style.backgroundColor = t === 'dark' ? '#0a141f' : '#f8fafc';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
