<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PerúCred · Tecnología para la Gestión Crediticia</title>
    <meta name="description" content="PerúCred: tecnología para la gestión crediticia. Clientes, solicitudes, préstamos y cronogramas." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#12365A" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Aplica el tema guardado (o el del sistema) ANTES de pintar: evita el destello del tema equivocado. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('nx-tema'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
        document.documentElement.style.backgroundColor = t === 'dark' ? '#07111f' : '#f5f7fa';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
